<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Журнал сделок</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Журнал">
<meta name="theme-color" content="#2b4a7a">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#16202b;--muted:#68768a;--line:#d9dfe6;--accent:#2b4a7a;--win:#13795b;--loss:#c23a3a;--winbg:#e3f3ed;--lossbg:#fbe8e8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--panel:#18202a;--ink:#e7ecf2;--muted:#90a0b5;--line:#2a3542;--accent:#7ea3dd;--win:#3fc79a;--loss:#f07676;--winbg:#14332a;--lossbg:#3a1d1f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151c;--panel:#18202a;--ink:#e7ecf2;--muted:#90a0b5;--line:#2a3542;--accent:#7ea3dd;--win:#3fc79a;--loss:#f07676;--winbg:#14332a;--lossbg:#3a1d1f;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Onest,system-ui,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}
.win{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.win>header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px;color:var(--muted)}
.win .body{padding:12px}
.stat .num{font-size:26px;font-weight:700}
.win.profit{border-top:3px solid var(--win)}.win.loss{border-top:3px solid var(--loss)}.win.net{border-top:3px solid var(--accent)}.win.rate{border-top:3px solid var(--muted)}
.pos{color:var(--win)}.neg{color:var(--loss)}
.wide{grid-column:1/-1}
.cols{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-top:12px}
form{display:grid;gap:10px}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:84px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 12px}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
button.x{padding:2px 8px;color:var(--muted)}
.trade{border-bottom:1px solid var(--line);padding:10px 12px;display:grid;gap:4px}
.trade:last-child{border:0}
.trade .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pill{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--bg);color:var(--muted)}
.amt{font-weight:700}
.why{color:var(--muted);font-size:14px;white-space:pre-wrap}
.empty{padding:20px 12px;color:var(--muted)}
@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}.stat .num{font-size:22px}}
</style>
</head>
<body>
<main>
<h1>Журнал сделок</h1>

<div class="grid">
  <section class="win profit stat"><header>Прибыль</header><div class="body"><div class="num pos" id="sProfit">0</div></div></section>
  <section class="win loss stat"><header>Убыток</header><div class="body"><div class="num neg" id="sLoss">0</div></div></section>
  <section class="win net stat"><header>Итого</header><div class="body"><div class="num" id="sNet">0</div></div></section>
  <section class="win rate stat"><header>Винрейт</header><div class="body"><div class="num" id="sRate">0%</div></div></section>
</div>

<div class="cols">
  <section class="win">
    <header>Новая сделка</header>
    <div class="body">
      <form id="f">
        <div class="row">
          <label>Инструмент<input id="sym" placeholder="BTC/USDT" required></label>
          <label>Направление<select id="dir"><option>Лонг</option><option>Шорт</option></select></label>
        </div>
        <label>Почему вошёл<textarea id="why" placeholder="Сетап, уровень, сигнал…" required></textarea></label>
        <label>Результат (+ прибыль, − убыток)<input id="pnl" type="number" step="any" placeholder="например 120 или -45" required></label>
        <button class="primary" type="submit">Добавить сделку</button>
      </form>
    </div>
  </section>

  <section class="win">
    <header><span>Сделки</span><button class="x" id="clear" type="button">Очистить всё</button></header>
    <div id="list" style="max-height:520px;overflow:auto"></div>
  </section>
</div>
</main>

<script>
(function(){
  var KEY="trade-journal-v1", trades=[];
  try{ var raw=localStorage.getItem(KEY); if(raw) trades=JSON.parse(raw)||[]; }catch(e){ trades=[]; }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(trades)); }catch(e){} }
  var $=function(id){return document.getElementById(id)};
  function fmt(n){ return (Math.round(n*100)/100).toLocaleString("ru-RU"); }
  function esc(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
  function render(){
    var p=0,l=0,w=0;
    trades.forEach(function(t){ if(t.pnl>0){p+=t.pnl;w++;} else if(t.pnl<0){l+=t.pnl;} });
    var net=p+l;
    $("sProfit").textContent="+"+fmt(p);
    $("sLoss").textContent=fmt(l);
    var n=$("sNet"); n.textContent=(net>0?"+":"")+fmt(net); n.className="num "+(net>0?"pos":net<0?"neg":"");
    $("sRate").textContent=trades.length?Math.round(w/trades.length*100)+"%":"0%";
    var list=$("list");
    if(!trades.length){ list.innerHTML='<div class="empty">Пока нет сделок. Добавь первую слева.</div>'; return; }
    list.innerHTML=trades.slice().reverse().map(function(t){
      var cls=t.pnl>0?"pos":t.pnl<0?"neg":"";
      return '<div class="trade"><div class="top"><div><strong>'+esc(t.sym)+'</strong> <span class="pill">'+esc(t.dir)+'</span> <span class="pill">'+esc(t.date)+'</span></div>'+
        '<div><span class="amt '+cls+'">'+(t.pnl>0?"+":"")+fmt(t.pnl)+'</span> <button class="x" data-id="'+t.id+'" aria-label="Удалить">✕</button></div></div>'+
        '<div class="why">'+esc(t.why)+'</div></div>';
    }).join("");
  }
  $("f").addEventListener("submit",function(e){
    e.preventDefault();
    trades.push({id:Date.now(),sym:$("sym").value.trim(),dir:$("dir").value,why:$("why").value.trim(),pnl:parseFloat($("pnl").value),date:new Date().toLocaleDateString("ru-RU")});
    save(); $("f").reset(); render();
  });
  $("list").addEventListener("click",function(e){
    var id=e.target.getAttribute&&e.target.getAttribute("data-id"); if(!id) return;
    trades=trades.filter(function(t){return String(t.id)!==id}); save(); render();
  });
  $("clear").addEventListener("click",function(){ if(trades.length&&confirm("Удалить все сделки?")){ trades=[]; save(); render(); } });
  render();
})();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}</script>
</body>
</html>
